<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Specimen Trophy och Två-manna</title>

<style>
:root{
  --text:#f3f4f6;
  --muted:rgba(255,255,255,.68);
  --accent:#33b5ff;
  --bg:#02070f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:var(--text);
  background:
    linear-gradient(rgba(0,8,18,.20), rgba(0,8,18,.42)),
    url("specimentrophy/images/sunset_background_for_github.jpg") center center / cover no-repeat fixed,
    var(--bg);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%, rgba(51,181,255,.10), transparent 24%),
    radial-gradient(circle at 80% 25%, rgba(10,132,255,.07), transparent 18%),
    radial-gradient(circle at 15% 70%, rgba(51,181,255,.05), transparent 22%);
}

.wrapper{
  position:relative;
  z-index:1;
  width:100%;
  max-width:520px;
  animation:pageEnter .35s ease both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(10px) scale(.985);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.hero{
  text-align:center;
  margin-bottom:18px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:7px 12px;
  margin-bottom:12px;
  border-radius:999px;
  color:#dff6ff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.35px;
  text-transform:uppercase;
  background:rgba(3,18,38,.72);
  border:1px solid rgba(51,181,255,.24);
  box-shadow:0 0 14px rgba(51,181,255,.12);
}

.hero h1{
  font-size:36px;
  line-height:1.05;
  font-weight:950;
  color:#ffffff;
  text-shadow:
    0 2px 10px rgba(0,0,0,.70),
    0 0 22px rgba(51,181,255,.28);
}

.hero p{
  max-width:380px;
  margin:10px auto 0;
  color:var(--muted);
  font-size:15px;
  line-height:1.45;
  font-weight:700;
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}

.grid{
  display:grid;
  gap:18px;
}

.competition-card{
  position:relative;
  display:grid;
  grid-template-columns:120px 1fr;
  gap:16px;
  align-items:center;
  min-height:178px;
  padding:18px;
  border-radius:28px;
  text-decoration:none;
  color:var(--text);
  background:
    linear-gradient(135deg, rgba(255,255,255,.045), transparent 30%),
    linear-gradient(180deg, rgba(5,14,30,.94), rgba(1,7,18,.98));
  border:1px solid rgba(51,181,255,.22);
  box-shadow:
    0 0 0 1px rgba(58,186,255,.14),
    0 10px 30px rgba(0,0,0,.27),
    0 0 18px rgba(51,181,255,.10);
  overflow:hidden;
  transition:
    transform .24s ease,
    box-shadow .24s ease,
    border-color .24s ease;
}

.competition-card::before{
  content:"";
  position:absolute;
  inset:-1px;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 0%, rgba(51,181,255,.16), transparent 34%),
    radial-gradient(circle at 100% 100%, rgba(10,132,255,.10), transparent 28%);
  opacity:.85;
}

.competition-card:hover{
  transform:translateY(-4px);
  border-color:rgba(51,181,255,.42);
  box-shadow:
    0 0 0 1px rgba(58,186,255,.28),
    0 18px 42px rgba(0,0,0,.34),
    0 0 30px rgba(51,181,255,.18);
}

.logo-box,
.card-content{
  position:relative;
  z-index:1;
}

.logo-box{
  height:118px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  background:rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.06);
}

.logo-box img{
  max-width:105px;
  max-height:96px;
  object-fit:contain;
  border-radius:18px;
  filter:
    drop-shadow(0 0 8px rgba(51,181,255,.30))
    drop-shadow(0 0 18px rgba(51,181,255,.18));
  transition:transform .24s ease, filter .24s ease;
}

.competition-card:hover img{
  transform:scale(1.06);
  filter:
    drop-shadow(0 0 12px rgba(51,181,255,.45))
    drop-shadow(0 0 26px rgba(51,181,255,.30));
}

.card-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}

.card-tag{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  color:#dff6ff;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.35px;
  background:rgba(51,181,255,.11);
  border:1px solid rgba(51,181,255,.22);
}

.card-content h2{
  margin:0 0 6px;
  font-size:21px;
  line-height:1.08;
  color:#ffffff;
}

.card-content p{
  color:var(--muted);
  font-size:13px;
  line-height:1.35;
  margin-bottom:12px;
}

.card-cta{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#ffffff;
  font-size:13px;
  font-weight:900;
}

.card-cta span{
  display:inline-flex;
  transition:transform .22s ease;
}

.competition-card:hover .card-cta span{
  transform:translateX(4px);
}

.footer-note{
  margin-top:18px;
  text-align:center;
  color:rgba(255,255,255,.58);
  font-size:12px;
  font-weight:700;
}

@media (max-width:520px){
  body{
    align-items:flex-start;
    padding:16px 10px;
  }

  .hero{
    margin-top:8px;
    margin-bottom:20px;
  }

  .hero h1{
    font-size:31px;
  }

  .competition-card{
    grid-template-columns:1fr;
    min-height:auto;
    padding:18px;
    text-align:center;
  }

  .logo-box{
    height:132px;
  }

  .logo-box img{
    max-width:145px;
    max-height:108px;
  }

  .card-top{
    justify-content:center;
  }
}

@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <header class="hero">
    <h1>Välj tävling</h1>
    <p>Registrera fångster, följ topplistor och se bilder från årets tävlingar.</p>
  </header>

  <main class="grid">

    <a class="competition-card" href="specimentrophy/index.html">
      <div class="logo-box">
        <img src="specimentrophy/images/Specimenlogo3.png" alt="Specimen Trophy">
      </div>

       <div class="card-content">
        <div class="card-top">
          <span class="card-tag"></span>
        </div>
        <h2>Specimen Trophy</h2>
        <div class="card-cta">Öppna tävling <span>→</span></div>
      </div>
    </a>

    <a class="competition-card" href="tvamanna/index.html">
      <div class="logo-box">
        <img src="tvamanna/images/logo_tvamanna2.png" alt="Två-manna">
      </div>

      <div class="card-content">
        <div class="card-top">
          <span class="card-tag"></span>
        </div>
        <h2>Två-manna</h2>
        <div class="card-cta">Öppna tävling <span>→</span></div>
      </div>
    </a>

  </main>

  <div class="footer-note">Välj en tävling för att komma vidare</div>

</div>

</body>
</html>
