<!DOCTYPE html>
<html lang="sv">
<head>
<link rel="stylesheet" href="../css/global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historik – Specimen Trophy</title>

<style>
:root{
  --text:#f3f4f6;
  --muted:rgba(255,255,255,.58);
  --accent:#33b5ff;
  --accent-2:#0a84ff;
  --green:#19d458;
  --error:#ff6b6b;
}

*{box-sizing:border-box}

html,body{
  min-height:100%;
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

body{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:10px 8px;
  background:
    linear-gradient(rgba(0,8,18,.18),rgba(0,8,18,.32)),
    url("images/sunset_background_for_github.jpg") center center / cover no-repeat fixed,
    #02070f;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(circle at 50% 0%, rgba(51,181,255,.06), transparent 24%),
    radial-gradient(circle at 80% 25%, rgba(10,132,255,.04), transparent 18%),
    radial-gradient(circle at 20% 20%, rgba(120,210,255,.03), transparent 24%),
    linear-gradient(to bottom, rgba(10,132,255,.01), transparent 25%);
}

.page{
  position:relative;
  z-index:1;
  width:100%;
  max-width:430px;
  display:flex;
  justify-content:center;
}

.frame{
  width:100%;
  max-width:430px;
  min-height:760px;
  padding:4px;
  border-radius:26px;
  position:relative;
  background:linear-gradient(180deg, rgba(58,186,255,.96), rgba(0,92,184,.86));
  box-shadow:
    0 0 0 1px rgba(58,186,255,.96),
    0 0 10px rgba(51,181,255,.30),
    0 0 20px rgba(10,132,255,.14),
    0 14px 28px rgba(0,0,0,.28);
  animation:pageEnter .28s ease both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(8px) scale(.985);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.frame::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:26px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(164,230,255,.92),
    0 0 8px rgba(51,181,255,.14);
}

.panel{
  width:100%;
  min-height:752px;
  background:linear-gradient(180deg, rgba(5,14,30,.92), rgba(1,7,18,.97));
  border:1px solid rgba(51,181,255,.14);
  border-radius:22px;
  padding:12px 10px 14px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 8px 20px rgba(0,0,0,.20);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  position:relative;
  overflow:visible;
}

.panel::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:22px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.04), transparent 18%, transparent 82%, rgba(51,181,255,.03));
}

.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
  position:relative;
  z-index:1;
  padding-top:42px;
}

.logo{
  width:min(100%,180px);
  display:block;
  border-radius:22px;
  filter:
    drop-shadow(0 0 8px rgba(51,181,255,.30))
    drop-shadow(0 0 18px rgba(51,181,255,.20))
    drop-shadow(0 0 34px rgba(10,132,255,.16));
  transition:transform .28s ease, filter .28s ease;
}

.logo:hover{
  transform:scale(1.025);
}

.title{
  text-align:center;
  margin-bottom:18px;
  position:relative;
  z-index:1;
  animation:softFadeUp .3s ease both;
}

.title h1{
  font-size:22px;
  font-weight:900;
  letter-spacing:.2px;
  margin:0;
}

.title p{
  margin-top:5px;
  font-size:13px;
  color:var(--muted);
}

@keyframes softFadeUp{
  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

form{
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
  z-index:2;
}

.field,
.custom-select{
  position:relative;
  display:grid;
  grid-template-columns:26px 1fr 20px;
  align-items:center;
  gap:10px;
  min-height:66px;
  padding:11px 12px;
  border-radius:16px;
  background:linear-gradient(90deg, rgba(2,11,23,.95), rgba(3,18,38,.88));
  border:1px solid rgba(255,255,255,.06);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 6px 14px rgba(0,0,0,.14);
  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease,
    background .22s ease;
  animation:fieldIn .24s ease both;
}

form > *:nth-child(1){animation-delay:.02s}
form > *:nth-child(3){animation-delay:.04s}
form > *:nth-child(5){animation-delay:.06s}
form > *:nth-child(6){animation-delay:.08s}
form > *:nth-child(7){animation-delay:.10s}
form > *:nth-child(9){animation-delay:.12s}

@keyframes fieldIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.field.compact-rightless{
  grid-template-columns:26px 1fr;
}

.field:hover,
.custom-select:hover{
  border-color:rgba(51,181,255,.22);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 8px 18px rgba(0,0,0,.16),
    0 0 12px rgba(51,181,255,.08);
  transform:translateY(-2px);
}

.field:focus-within,
.custom-select.open{
  border-color:rgba(51,181,255,.42);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 8px 18px rgba(0,0,0,.18),
    0 0 16px rgba(51,181,255,.16);
}

.custom-select,
.date-field,
.upload-field{
  cursor:pointer;
}

.custom-select.open{
  z-index:30;
}

.field-icon,
.field-end{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  align-self:flex-start;
  padding-top:2px;
  pointer-events:none;
}

.field-body{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:40px;
}

.field-label{
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.92);
  margin-bottom:4px;
  line-height:1;
}

.field-icon svg,
.field-end svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.field input[type="number"],
.field input[type="text"],
.field input[type="date"],
.selected,
.upload-text,
.code-input{
  width:100%;
  border:0;
  background:transparent !important;
  color:var(--text);
  font-size:16px;
  line-height:1.2;
  outline:none;
  padding:0;
  margin:0;
  font-weight:500;
  min-height:24px;
  display:flex;
  align-items:center;
  appearance:none;
  -webkit-appearance:none;
  box-shadow:none;
}

.field input[type="number"],
.field input[type="text"],
.field input[type="date"]{
  cursor:text;
}

.field input[type="date"]{
  color-scheme:dark;
  text-align:left;
  cursor:pointer;
}

.field input::placeholder,
.code-input::placeholder{
  color:var(--muted);
  opacity:1;
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.selected{
  color:var(--muted);
  cursor:pointer;
  user-select:none;
  pointer-events:none;
}

.selected.active{
  color:var(--text);
}

.custom-select .field-end{
  transition:transform .24s ease;
}

.custom-select.open .field-end{
  transform:rotate(180deg);
}

.options{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 6px);
  background:rgba(6,15,28,.98);
  border:1px solid rgba(51,181,255,.24);
  border-radius:14px;
  z-index:9999;
  box-shadow:
    0 0 14px rgba(51,181,255,.12),
    0 10px 24px rgba(0,0,0,.24);
  max-height:190px;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  scrollbar-width:thin;
  scrollbar-color:rgba(51,181,255,.45) rgba(6,15,28,.98);
}

.options::-webkit-scrollbar{
  width:8px;
}

.options::-webkit-scrollbar-track{
  background:rgba(6,15,28,.98);
  border-radius:999px;
}

.options::-webkit-scrollbar-thumb{
  background:rgba(51,181,255,.45);
  border-radius:999px;
}

.options::-webkit-scrollbar-thumb:hover{
  background:rgba(51,181,255,.65);
}

.custom-select.open .options{
  display:block;
  animation:dropdownIn .2s ease both;
}

@keyframes dropdownIn{
  from{
    opacity:0;
    transform:translateY(-6px) scale(.985);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.options div{
  width:100%;
  padding:10px 12px;
  font-size:14px;
  color:#f3f4f6;
  border-top:1px solid rgba(255,255,255,.05);
  text-align:center;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:
    background .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}

.options div:first-child{
  border-top:0;
}

.options div:hover{
  background:rgba(51,181,255,.12);
  box-shadow:inset 0 0 12px rgba(51,181,255,.08);
}

.file-input{
  display:none;
}

.upload-text{
  color:rgba(255,255,255,.92);
  font-size:15px;
  font-weight:600;
}

.upload-subtext{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.3;
}

.submit-btn,
.modal-btn{
  border:0;
  border-radius:16px;
  font-size:18px;
  font-weight:800;
  color:white;
  cursor:pointer;
}

.submit-btn{
  margin-top:4px;
  height:54px;
  background:linear-gradient(180deg, #29d454 0%, #12b341 50%, #079734 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 0 12px rgba(28,209,79,.22),
    0 8px 18px rgba(0,0,0,.22);
  transition:
    transform .22s ease,
    filter .22s ease,
    box-shadow .22s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  position:relative;
  z-index:1;
}

.submit-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 0 18px rgba(28,209,79,.30),
    0 10px 22px rgba(0,0,0,.26);
}

.submit-btn:active{
  transform:translateY(0) scale(.99);
}

.success{
  display:none;
  margin-top:10px;
  color:var(--green);
  font-weight:700;
  font-size:17px;
  text-align:center;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-shadow:0 0 10px rgba(25,212,88,.22);
  position:relative;
  z-index:1;
}

.success.show{
  display:flex;
  animation:softFadeUp .22s ease both;
}

.date-field input[type=date]::-webkit-calendar-picker-indicator{
  opacity:0;
  position:absolute;
  width:100%;
  height:100%;
  cursor:pointer;
  left:0;
  top:0;
}

.invalid-field{
  border-color:var(--error) !important;
  box-shadow:
    0 0 0 1px rgba(255,107,107,.20),
    0 0 14px rgba(255,107,107,.18),
    inset 0 1px 0 rgba(255,255,255,.03) !important;
  animation:shake .18s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}
}

.error-text{
  display:none;
  margin-top:5px;
  color:var(--error);
  font-size:12px;
  line-height:1.2;
}

.invalid-field .error-text{
  display:block;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:99999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
  animation:modalFade .18s ease both;
}

@keyframes modalFade{
  from{opacity:0}
  to{opacity:1}
}

.modal-box{
  width:100%;
  max-width:320px;
  background:linear-gradient(180deg, rgba(5,16,34,.97), rgba(2,10,22,.99));
  border:1px solid rgba(51,181,255,.22);
  border-radius:18px;
  padding:18px 16px;
  box-shadow:
    0 0 18px rgba(51,181,255,.16),
    0 14px 30px rgba(0,0,0,.35);
  text-align:center;
  animation:modalBoxIn .22s ease both;
}

@keyframes modalBoxIn{
  from{
    opacity:0;
    transform:scale(.965) translateY(6px);
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.modal-box h3{
  margin:0 0 8px;
  font-size:18px;
}

.modal-box p{
  margin:0 0 14px;
  color:var(--muted);
  font-size:14px;
  line-height:1.4;
}

.code-input{
  height:52px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(90deg, rgba(2,11,23,.95), rgba(3,18,38,.88)) !important;
  text-align:center;
  font-size:22px;
  letter-spacing:4px;
}

.code-input:focus{
  border-color:rgba(51,181,255,.45);
  box-shadow:0 0 12px rgba(51,181,255,.14);
}

.code-error{
  display:none;
  color:var(--error);
  font-size:12px;
  margin-top:8px;
}

.code-error.show{
  display:block;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-btn{
  flex:1;
  height:46px;
  font-size:15px;
  font-weight:700;
  transition:transform .2s ease, filter .2s ease;
}

.modal-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.04);
}

.cancel-btn{
  background:#1f2937;
}

.confirm-btn{
  background:linear-gradient(180deg, #29d454 0%, #12b341 50%, #079734 100%);
}

.modal-ok-btn{
  display:none;
  width:100%;
  height:54px;
  margin-top:16px;
  border:0;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  color:#ffffff;
  cursor:pointer;
  background:linear-gradient(180deg, #29d454 0%, #12b341 50%, #079734 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 0 16px rgba(28,209,79,.28),
    0 8px 18px rgba(0,0,0,.22);
}

.modal-ok-btn.show{
  display:block;
}

.modal-success{
  color:#19d458 !important;
  font-weight:800;
  text-shadow:0 0 10px rgba(25,212,88,.25);
}

@media (max-width:420px){
  body{
    padding:10px 8px;
  }

  .page{
    max-width:100%;
  }

  .frame{
    max-width:100%;
    width:100%;
  }

  .logo{
    width:min(100%,182px);
  }

  .field,
  .custom-select{
    min-height:68px;
    padding:12px 12px;
    gap:10px;
  }

  .field input[type="number"],
  .field input[type="text"],
  .field input[type="date"],
  .selected,
  .upload-text{
    font-size:16px;
  }

  .submit-btn{
    height:56px;
    font-size:18px;
  }
}

@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }
}
  @media (min-width:768px){

  .frame,
  .app-shell,
  .shell{
    max-width:450px;
  }

  .page,
  .page-wrap{
    max-width:520px;
  }

}
</style>

<style>
/* HISTORIK – använder samma grundkomponenter som Specimen Trophy */
.history-form{
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
  z-index:2;
}

.history-year-field{
  position:relative;
  cursor:pointer;
  animation:fieldIn .24s ease both;
}

/* Lägg själva select-kontrollen över hela rutan så även ikon och pil fungerar. */
.history-year-field select{
  position:absolute;
  inset:0;
  z-index:5;
  width:100%;
  height:100%;
  border:0;
  opacity:0;
  cursor:pointer;
  color-scheme:dark;
}

.history-year-value{
  color:var(--text);
  font-size:16px;
  line-height:1.2;
  font-weight:500;
  min-height:24px;
  display:flex;
  align-items:center;
  pointer-events:none;
}

.history-year-field select option{
  background:#06101c;
  color:#f3f4f6;
}

.history-view-btn{
  width:100%;
  margin-top:0;
}

.history-view-btn:disabled{
  opacity:.42;
  cursor:not-allowed;
  transform:none !important;
  filter:none !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    0 6px 14px rgba(0,0,0,.16);
}

.history-excel-btn{
  width:100%;
  min-height:50px;
  margin-top:0;
  padding:10px 14px;
  font-size:14px;
  line-height:1.25;
  background:linear-gradient(180deg, rgba(4,25,47,.98), rgba(2,14,29,.98));
  border:1px solid rgba(51,181,255,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 6px 14px rgba(0,0,0,.18);
}
.history-excel-btn:disabled{
  opacity:.42;
  cursor:not-allowed;
  transform:none !important;
  filter:none !important;
}

.history-hint{
  margin:1px 4px 0;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
  animation:softFadeUp .3s ease both;
}

/*
  Samma knappositioner som originalets Start / Regler / Topplistor.
  De tre knapparna är medvetet inte ett nytt grid-system.
*/
.btn{
  position:absolute;
  top:12px;
  min-height:32px;
  padding:7px 12px;
  border:1px solid rgba(51,181,255,.28);
  border-radius:12px;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,rgba(4,25,47,.96),rgba(2,14,29,.96));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 5px 12px rgba(0,0,0,.18);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  z-index:1000;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:rgba(51,181,255,.52);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 7px 16px rgba(0,0,0,.22),
    0 0 12px rgba(51,181,255,.10);
}

.btn-left{left:10px}
.btn-right{right:10px}
.btn-center{
  left:50%;
  transform:translateX(-50%);
}
.btn-center:hover{
  transform:translateX(-50%) translateY(-1px);
}

@media (max-width:420px){
  .panel{
    padding:12px 10px 14px;
  }

  .btn{
    min-height:32px;
    padding:7px 11px;
    font-size:12px;
  }

  .history-year-field select{
    font-size:16px;
  }
}
</style>


<style>
/* Historikens inbyggda galleri – samma kortstil som galleri.html */
.history-gallery-wrap{display:none;margin-top:18px;position:relative;z-index:1;animation:softFadeUp .28s ease both}
.history-gallery-wrap.show{display:block}
.history-gallery-wrap.show ~ .history-hint{display:none}
.history-gallery-heading{text-align:center;margin:0 0 12px;font-size:18px;font-weight:900}
.history-gallery-count{text-align:center;color:var(--muted);font-size:12px;margin:-5px 0 13px}
.history-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.history-gallery .card{min-width:0;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.025);border:1px solid rgba(51,181,255,.16);box-shadow:0 8px 20px rgba(0,0,0,.24),0 0 14px rgba(51,181,255,.07);animation:cardIn .26s ease both}
.history-gallery .image-wrap{width:100%;aspect-ratio:1/1;background:rgba(0,0,0,.25);overflow:hidden;cursor:pointer}
.history-gallery .image-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s ease,filter .28s ease}
.history-gallery .image-wrap:hover img{transform:scale(1.045);filter:brightness(1.08)}
.history-gallery .card-caption{padding:10px 7px 12px;text-align:center;background:linear-gradient(180deg,rgba(4,20,42,.96),rgba(1,9,22,.99));border-top:1px solid rgba(51,181,255,.16)}
.history-gallery .name{font-size:12px;font-weight:900;margin-bottom:5px;color:#fff;line-height:1.2;overflow-wrap:anywhere}
.history-gallery .meta{font-size:10px;color:var(--muted);line-height:1.45}
.history-gallery .meta strong{color:var(--accent);font-weight:900}
.history-gallery-message{grid-column:1/-1;text-align:center;padding:22px 10px;color:var(--muted);font-size:14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(51,181,255,.12)}
.history-lightbox{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.history-lightbox.show{display:flex;animation:modalFade .18s ease both}
.history-lightbox-inner{width:100%;max-width:720px;position:relative}
.history-lightbox-close{position:absolute;top:-44px;right:0;width:36px;height:36px;border-radius:999px;border:1px solid rgba(51,181,255,.34);background:rgba(2,11,23,.96);color:#fff;font-size:24px;cursor:pointer}
.history-lightbox img{width:100%;max-height:80vh;object-fit:contain;border-radius:20px;box-shadow:0 0 0 1px rgba(51,181,255,.25),0 0 30px rgba(51,181,255,.18),0 18px 50px rgba(0,0,0,.45)}
@media(max-width:420px){.history-gallery{gap:10px}}
</style>

  const yearSelect = document.getElementById("year");
  const yearDisplay = document.getElementById("yearDisplay");
  const yearField = document.querySelector(".history-year-field");
  const viewBtn = document.getElementById("viewBtn");
  const excelBtn = document.getElementById("excelBtn");
  const excelLinks = {
    "2026": "https://drive.google.com/file/d/1IgiPU3CEyMACMxDfZ-7nqyxCiLqTO1bG/view",
    "2027": "",
    "2028": "",
    "2029": "",
    "2030": ""
  };
  const galleryWrap = document.getElementById("historyGalleryWrap");
  const galleryEl = document.getElementById("historyGallery");
  const galleryHeading = document.getElementById("historyGalleryHeading");
  const galleryCount = document.getElementById("historyGalleryCount");
  const lightbox = document.getElementById("historyLightbox");
  const lightboxImg = document.getElementById("historyLightboxImg");
  const lightboxClose = document.getElementById("historyLightboxClose");

  function escapeHtml(value) {
    return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function updateHistoryButton() {
    const year = yearSelect.value;
    yearDisplay.textContent = yearSelect.options[yearSelect.selectedIndex].text;
    viewBtn.disabled = !year;
    excelBtn.disabled = !year || !excelLinks[year];
  }
  excelBtn.addEventListener("click", () => {
    const url = excelLinks[yearSelect.value];
    if (url) window.open(url, "_blank", "noopener,noreferrer");
  });
  yearField.addEventListener("click", () => yearSelect.focus());
  yearSelect.addEventListener("change", () => {
    updateHistoryButton();
    galleryWrap.classList.remove("show");
    document.querySelector(".history-hint").style.display = "";
    galleryEl.innerHTML = "";
  });
  function openLightbox(url, alt) { lightboxImg.src = url; lightboxImg.alt = alt || "Fångstbild"; lightbox.classList.add("show"); }
  function closeLightbox() { lightbox.classList.remove("show"); lightboxImg.src = ""; }
  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", event => { if(event.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", event => { if(event.key === "Escape") closeLightbox(); });

  function renderGallery(year) {
    const items = galleryDataByYear[year];
    galleryWrap.classList.add("show");
    document.querySelector(".history-hint").style.display = "none";
    galleryHeading.textContent = `Fångstgalleri ${year}`;
    if (!items) {
      galleryCount.textContent = "";
      galleryEl.innerHTML = '<div class="history-gallery-message">Det finns ännu ingen Excel-data inlagd för detta år!</div>';
      return;
    }
    const visibleItems = items.filter(item => item.imageUrl);
    galleryCount.textContent = `${visibleItems.length} fångster med bild`;
    if (!visibleItems.length) {
      galleryEl.innerHTML = '<div class="history-gallery-message">Inga fångster med bild hittades för detta år.</div>';
      return;
    }
    galleryEl.innerHTML = visibleItems.map((item,index) => `
      <article class="card">
        <div class="image-wrap" data-index="${index}">
          <img loading="lazy" src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.art || "Fångstbild")}">
        </div>
        <div class="card-caption">
          <div class="name">${escapeHtml(item.deltagare || "Okänd deltagare")}</div>
          <div class="meta"><strong>${escapeHtml(item.art || "Okänd art")}</strong> • ${escapeHtml(item.vikt || "")} g<br>${escapeHtml(item.datum || "")}</div>
        </div>
      </article>`).join("");
    galleryEl.querySelectorAll(".image-wrap").forEach(element => element.addEventListener("click", () => {
      const item = visibleItems[Number(element.dataset.index)];
      if (item && item.imageUrl) openLightbox(item.imageUrl, item.art);
    }));
  }
  updateHistoryButton();
  viewBtn.addEventListener("click", () => {
    if (!yearSelect.value) return;
    renderGallery(yearSelect.value);
    galleryWrap.scrollIntoView({behavior:"smooth",block:"start"});
  });
</script>
