<!DOCTYPE html>
<html lang="sv">
<head>
  <link rel="stylesheet" href="../css/global.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Två-manna Galleri</title>

  <style>
    :root{
      --text:#f3f4f6;
      --muted:rgba(255,255,255,.68);
      --accent:#33b5ff;
      --bg:#02070f;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      padding:10px 8px;
      background:
        linear-gradient(rgba(0,8,18,.18),rgba(0,8,18,.32)),
        url("images/background_tvamanna.jpg") center center / cover no-repeat fixed,
        var(--bg);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 0%, rgba(51,181,255,.06), transparent 24%),
        radial-gradient(circle at 80% 25%, rgba(10,132,255,.04), transparent 18%);
    }

    .page{
      position:relative;
      z-index:1;
      width:100%;
      max-width:430px;
      margin:0 auto;
    }

    .shell{
      position:relative;
      min-height:760px;
      padding:4px;
      border-radius:26px;
      background:linear-gradient(180deg, rgba(58,186,255,.96), rgba(0,92,184,.86));
      box-shadow:
        0 0 0 1px rgba(58,186,255,.96),
        0 0 10px rgba(51,181,255,.30),
        0 0 20px rgba(10,132,255,.14),
        0 14px 28px rgba(0,0,0,.28);
      animation:pageEnter .28s ease both;
    }

    @keyframes pageEnter{
      from{
        opacity:0;
        transform:translateY(8px) scale(.985);
      }

      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .panel{
      min-height:752px;
      border-radius:22px;
      padding:12px 10px 14px;
      background:linear-gradient(180deg, rgba(5,14,30,.92), rgba(1,7,18,.97));
      border:1px solid rgba(51,181,255,.14);
      position:relative;
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      padding-top:42px;
      margin-bottom:12px;
    }

    .logo{
      width:min(100%,180px);
      border-radius:22px;
      filter:
        drop-shadow(0 0 8px rgba(51,181,255,.30))
        drop-shadow(0 0 18px rgba(51,181,255,.20))
        drop-shadow(0 0 34px rgba(10,132,255,.16));
      transition:
        transform .28s ease,
        filter .28s ease;
    }

    .logo:hover{
      transform:scale(1.025);
    }

    .title{
      text-align:center;
      margin-bottom:18px;
      animation:softFadeUp .32s ease both;
    }

    .title h1{
      font-size:22px;
      font-weight:900;
      letter-spacing:.2px;
    }

    .title p{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
    }

    @keyframes softFadeUp{
      from{
        opacity:0;
        transform:translateY(6px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:14px;
    }

    .card{
      border-radius:18px;
      overflow:hidden;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(51,181,255,.16);
      box-shadow:
        0 8px 20px rgba(0,0,0,.24),
        0 0 14px rgba(51,181,255,.07);
      transition:
        transform .24s ease,
        box-shadow .24s ease,
        border-color .24s ease;
      animation:cardIn .26s ease both;
    }

    .card:nth-child(1){ animation-delay:.02s; }
    .card:nth-child(2){ animation-delay:.04s; }
    .card:nth-child(3){ animation-delay:.06s; }
    .card:nth-child(4){ animation-delay:.08s; }
    .card:nth-child(5){ animation-delay:.10s; }
    .card:nth-child(6){ animation-delay:.12s; }

    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(8px) scale(.985);
      }

      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .card:hover{
      transform:translateY(-3px);
      border-color:rgba(51,181,255,.34);
      box-shadow:
        0 12px 26px rgba(0,0,0,.32),
        0 0 22px rgba(51,181,255,.12);
    }

    .image-wrap{
      width:100%;
      aspect-ratio:1 / 1;
      background:rgba(0,0,0,.25);
      overflow:hidden;
      cursor:pointer;
    }

    .image-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:
        transform .28s ease,
        filter .28s ease;
    }

    .image-wrap:hover img{
      transform:scale(1.045);
      filter:brightness(1.08);
    }

    .card-caption{
      padding:10px 8px 12px;
      text-align:center;
      background:linear-gradient(180deg, rgba(4,20,42,.96), rgba(1,9,22,.99));
      border-top:1px solid rgba(51,181,255,.16);
    }

    .name{
      font-size:13px;
      font-weight:900;
      margin-bottom:5px;
      color:#ffffff;
      line-height:1.2;
    }

    .team{
      font-size:11px;
      font-weight:800;
      color:var(--accent);
      margin-bottom:4px;
      line-height:1.25;
    }

    .meta{
      font-size:11px;
      color:var(--muted);
      line-height:1.45;
    }

    .meta strong{
      color:var(--accent);
      font-weight:900;
    }

    .loading,
    .empty,
    .error{
      grid-column:1 / -1;
      text-align:center;
      padding:22px 10px;
      color:var(--muted);
      font-size:14px;
      border-radius:16px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(51,181,255,.12);
      animation:softFadeUp .25s ease both;
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:99999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .lightbox.show{
      display:flex;
      animation:modalFade .18s ease both;
    }

    @keyframes modalFade{
      from{
        opacity:0;
      }

      to{
        opacity:1;
      }
    }

    .lightbox-inner{
      width:100%;
      max-width:720px;
      position:relative;
      animation:modalImageIn .22s ease both;
    }

    @keyframes modalImageIn{
      from{
        opacity:0;
        transform:scale(.965);
      }

      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .lightbox-close{
      position:absolute;
      top:-44px;
      right:0;
      width:36px;
      height:36px;
      border-radius:999px;
      border:1px solid rgba(51,181,255,.34);
      background:rgba(2,11,23,.96);
      color:#fff;
      font-size:24px;
      cursor:pointer;
      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .lightbox-close:hover{
      transform:scale(1.06);
      border-color:rgba(51,181,255,.62);
      box-shadow:0 0 14px rgba(51,181,255,.18);
    }

    .lightbox img{
      width:100%;
      max-height:80vh;
      object-fit:contain;
      border-radius:20px;
      box-shadow:
        0 0 0 1px rgba(51,181,255,.25),
        0 0 30px rgba(51,181,255,.18),
        0 18px 50px rgba(0,0,0,.45);
    }

    @media (max-width:420px){
      .gallery{
        gap:10px;
      }

      .name{
        font-size:12px;
      }

      .team,
      .meta{
        font-size:10px;
      }
    }
    /* Endast webbläsare/desktop */
@media (min-width:768px){
  .page-wrap{
    max-width:520px;
  }

  .app-shell{
    max-width:450px;
    margin:0 auto;
  }
}

    @media (prefers-reduced-motion: reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="shell">
      <div class="panel">

        <a href="topplistor.html" class="btn btn-left">← Tillbaka</a>
        <a href="../index.html" class="btn btn-right">Huvudsidan →</a>

        <div class="logo-wrap">
          <img src="images/logo_tvamanna2.png" alt="Två-manna" class="logo">
        </div>

        <div class="title">
          <h1>Fångstgalleri</h1>
          <p>Alla fångster hittills - stora som små!</p>
        </div>

        <div id="gallery" class="gallery">
          <div class="loading">Laddar galleri...</div>
        </div>

      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lightboxClose" type="button">×</button>
      <img id="lightboxImg" src="" alt="">
    </div>
  </div>

  <script>
    const API_URL = "https://matteek89-specimentrophy.vercel.app/api/topplistor-tvaman";

    const galleryEl = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function openLightbox(url){
      lightboxImg.src = url;
      lightbox.classList.add("show");
    }

    function closeLightbox(){
      lightbox.classList.remove("show");
      lightboxImg.src = "";
    }

    lightboxClose.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", (event)=>{
      if(event.target === lightbox){
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (event)=>{
      if(event.key === "Escape"){
        closeLightbox();
      }
    });

    async function loadGallery(){
      try{
        const response = await fetch(`${API_URL}?t=${Date.now()}`, {
          cache: "no-store"
        });

        const data = await response.json();

        if(!response.ok){
          throw new Error(data.error || "Kunde inte läsa galleriet");
        }

        const items = data.Galleri || [];

        if(items.length === 0){
          galleryEl.innerHTML = `<div class="empty">Inga godkända bilder finns ännu.</div>`;
          return;
        }

        galleryEl.innerHTML = items.map((item, index) => `
          <article class="card">
            <div class="image-wrap" data-index="${index}">
              <img
                src="${escapeHtml(item.imageUrl)}"
                alt="${escapeHtml(item.art || "Fångstbild")}"
              >
            </div>

            <div class="card-caption">
              <div class="name">${escapeHtml(item.deltagare || "Okänd deltagare")}</div>
              <div class="team">${escapeHtml(item.lag || "Okänt lag")}</div>

              <div class="meta">
                <strong>${escapeHtml(item.art || "Okänd art")}</strong> • ${escapeHtml(item.vikt || "")} g<br>
                ${escapeHtml(item.datum || "")}
              </div>
            </div>
          </article>
        `).join("");

        document.querySelectorAll(".image-wrap").forEach((element)=>{
          element.addEventListener("click", ()=>{
            const item = items[Number(element.dataset.index)];

            if(item && item.imageUrl){
              openLightbox(item.imageUrl);
            }
          });
        });

      }catch(error){
        console.error(error);
        galleryEl.innerHTML = `<div class="error">Kunde inte läsa galleriet just nu.</div>`;
      }
    }

    loadGallery();
  </script>
</body>
</html>
